<!DOCTYPE html>
<html>
<head>
    <title>Ubah Warna</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        #kotak {
            width: 300px;
            height: 200px;
            margin: 30px auto;
            background-color: gray;

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Ubah Warna Kotak</h1>

    <div id="kotak">
        KOTAK WARNA
    </div>

    <button onclick="ubahwarna('red')">MERAH</button>
    <button onclick="ubahwarna('green')">HIJAU</button>
    <button onclick="ubahwarna('blue')">BIRU</button>

    <script>
        function ubahwarna(warna) {
            document.getElementById("kotak").style.backgroundColor = warna;
        }
    </script>

</body>
</html>
